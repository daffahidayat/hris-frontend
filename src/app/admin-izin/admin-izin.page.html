<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Approval Izin / Cuti</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #fafafc;">
  
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" refreshingSpinner="circles"></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="daftarIzin.length === 0" style="text-align: center; padding: 40px 20px; color: #7f8fa6;">
    <ion-icon name="document-text-outline" style="font-size: 48px; color: #dcdde1;"></ion-icon>
    <p>Belum ada pengajuan izin/cuti dari karyawan.</p>
  </div>

  <div style="padding-bottom: 20px;">
    
    <ion-card *ngFor="let izin of daftarIzin" style="margin: 0 0 15px 0; border-radius: 12px; background: white; border: 1px solid #e2e8f0; box-shadow: none;">
      <ion-card-content style="padding: 16px;">
        
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
          <div style="font-weight: 700; color: #2d3436; font-size: 16px; display: flex; align-items: center;">
            <ion-icon name="person-outline" style="margin-right: 8px; color: #3498db; font-size: 18px;"></ion-icon>
            {{ izin.user ? izin.user.name : 'Karyawan' }}
          </div>
          
          <ion-badge [color]="izin.status === 'approved' ? 'success' : (izin.status === 'rejected' ? 'danger' : 'warning')" 
                     style="border-radius: 20px; padding: 6px 12px; font-size: 11px; font-weight: bold;">
            {{ izin.status | uppercase }}
          </ion-badge>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; margin-left: 26px;">
          <div style="font-size: 13px; color: #636e72; display: flex; align-items: center;">
            <ion-icon name="calendar-outline" style="margin-right: 6px;"></ion-icon>
            {{ izin.tanggal }}
          </div>
          <div style="font-size: 13px; font-weight: bold; color: #3498db; display: flex; align-items: center;">
            <ion-icon name="document-text-outline" style="margin-right: 6px;"></ion-icon>
            Tipe: {{ izin.tipe_izin }}
          </div>
        </div>
        
        <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #f1f2f6; margin-bottom: 15px;">
          <div style="font-size: 11px; color: #a4b0be; margin-bottom: 4px; font-weight: 700;">ALASAN / KETERANGAN:</div>
          <div style="font-size: 14px; color: #2d3436; line-height: 1.5; white-space: pre-wrap;">{{ izin.alasan }}</div>
        </div>

        <div *ngIf="izin.status === 'pending'" style="display: flex; gap: 10px;">
          <ion-button expand="block" color="danger" fill="outline" style="flex: 1; --border-radius: 8px;" (click)="prosesIzin(izin.id, 'rejected')">
            <ion-icon name="close-circle-outline" slot="start"></ion-icon> TOLAK
          </ion-button>
          <ion-button expand="block" color="success" style="flex: 1; --border-radius: 8px;" (click)="prosesIzin(izin.id, 'approved')">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon> ACC
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
